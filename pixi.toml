[workspace]
name = "qwen-strata"
description = "12G 显存本地 LLM：一个 Strata 服务承载 Qwen3.8-Flash-Next 与 Qwen3.6-35B-A3B，pixi 管依赖 + 容器运行"
channels = ["conda-forge"]
platforms = ["linux-64"]

# 依赖一律通过 pixi 声明（不要 pip install / npm install 绕过）
# 说明：docker 本身是宿主级服务，无法由 pixi 安装，见 README「前置条件」。
[dependencies]
python = "3.12.*"
curl = ">=8.10"
jq = ">=1.7"

[tasks]
# ---------------- 容器 ----------------
config     = { cmd = "docker compose config", description = "渲染并校验 docker-compose 配置（不启动容器）" }
up         = { cmd = "docker compose up -d", description = "启动服务（首次会下载当前模型的权重）" }
recreate   = { cmd = "docker compose up -d --force-recreate", description = "按当前 .env 重建容器（改配置 / 切模型后用）" }
down       = { cmd = "docker compose down", description = "停止并移除容器（模型与 preset 留在数据目录）" }
stop       = { cmd = "docker compose stop", description = "停止服务（卸载模型，释放显存与内存）" }
restart    = { cmd = "docker compose restart", description = "重启容器（不会重新读取 .env，改配置请用 recreate）" }
logs       = { cmd = "docker compose logs -f --tail=200", description = "跟随日志（首次启动看下载进度）" }
ps         = { cmd = "docker compose ps", description = "查看容器状态与健康检查" }
shell      = { cmd = "docker compose exec strata sh", description = "进入容器" }
pull       = { cmd = "docker compose pull", description = "拉取 / 更新 Strata 镜像" }
key        = { cmd = "docker compose exec -T strata sh -c 'strata launch --show-key --preset \"$PRESET\"'", description = "打印 API key（未在 .env 设置时由首启自动生成）" }

# ---------------- 选模型 ----------------
# 同一个服务，切换模型 = 改 .env 的 FAMILY / MODEL / PRESET 并重建容器。
model-flash = { cmd = "bash scripts/select_model.sh flash", description = "切到 Qwen3.8-Flash-Next（qwen / IQ2_XS）并重建容器" }
model-35b   = { cmd = "bash scripts/select_model.sh 35b", description = "切到 Qwen3.6-35B-A3B（qwen36 / UD-Q4_K_XL）并重建容器" }

# ---------------- 验收 / 调参 ----------------
preflight  = { cmd = "bash scripts/preflight.sh", description = "环境自检：docker / GPU 运行时 / 驱动 / 内存 / 磁盘 / 端口 / 已下载模型 / compose 渲染" }
smoke      = { cmd = "python scripts/smoke.py", depends-on = ["up"], description = "冒烟：健康检查 + 模型列表 + 一次 chat 补全 + 吞吐" }
longctx    = { cmd = "python scripts/longctx.py", depends-on = ["up"], description = "长上下文召回实测：按深度埋 passcode，记录召回与端到端速度" }
