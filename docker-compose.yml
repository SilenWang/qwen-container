# 本地推理服务，两个模型共用一个 compose 文件（配置说明见 README）：
#
#   llama-server  Qwen3.6-35B-A3B    —— llama.cpp 引擎，默认启动，宿主 8080
#   strata        Qwen3.8-Flash-Next —— Strata 引擎，只在 `--profile strata` 下启动，宿主 8081
#
# 12G 卡同一时间只能跑其中一个服务（显存不够），切换时先停掉另一个。
#
#   cp .env.example .env     # 按需改配置
#   pixi run download        # 下载模型一的 GGUF 权重
#   pixi run up              # 启动模型一
#   pixi run smoke           # 模型一自检
#
#   pixi run strata-up       # 启动模型二（首次启动自动下载模型，约 70 GB）
#   pixi run strata-smoke    # 模型二自检
name: qwen36-35b-a3b

services:
  llama-server:
    # 固定到已验证的 build 号；锁定 digest 见 `pixi run pin-image`
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b11146}
    container_name: qwen36-35b-a3b
    restart: unless-stopped
    # NVIDIA GPU 透传（等价 docker run --gpus all）
    gpus: all
    ports:
      # 默认只绑本机回环；需要局域网 / 远程访问时把 BIND_ADDR 改成 0.0.0.0
      # （服务本身没有鉴权，暴露到公网前请自行加反代 + 认证）
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
      - ./cache:/cache
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf}
      - --alias
      - ${MODEL_ALIAS:-qwen3.6-35b-a3b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # ---- 上下文与显存 ----
      - --ctx-size
      - "${CTX_SIZE:-131072}"
      - --n-gpu-layers
      - "${N_GPU_LAYERS:-99}"
      # MoE 专家权重留在系统内存的「前 N 层」：12G 卡唯一真正省显存的旋钮
      # （专家张量占权重的 88%）。用 `pixi run tune-ncmoe` 从 40 往下扫，
      # 取最后一个能起来的档位再回退一档。默认 28 是按 12G 显存账算的留余量值。
      - --n-cpu-moe
      - "${N_CPU_MOE:-28}"
      # 关掉 --fit 的自动调参：显存按显式参数算，避免「空上下文估得下、填满后 OOM」
      - --fit
      - "${FIT:-off}"

      # ---- 长上下文关键项 ----
      # K/V 量化类型必须一致，否则 CUDA 端 FlashAttention 内核会静默回落到 CPU 后端
      - --flash-attn
      - "${FLASH_ATTN:-on}"
      - --cache-type-k
      - "${CACHE_TYPE_K:-q8_0}"
      - --cache-type-v
      - "${CACHE_TYPE_V:-q8_0}"
      # 不走 mmap：长 prompt 不会把 page cache 刷掉（none 即旧版的 --no-mmap）
      - --load-mode
      - "${LOAD_MODE:-none}"

      # ---- 批 / 线程 / 并发 ----
      - --batch-size
      - "${BATCH_SIZE:-2048}"
      - --ubatch-size
      - "${UBATCH_SIZE:-1024}"
      # -1 = 自动（llama.cpp 取物理核心数）；prefill 偏慢时可显式指定
      - --threads
      - "${THREADS:--1}"
      # 1 个 slot 独占整个 128K KV；调大后每个 slot 的上下文会被均分
      - --parallel
      - "${PARALLEL:-1}"

      # ---- 服务能力 ----
      - --jinja
      - --metrics
      - --slot-save-path
      - /cache

      # ---- 可选：多模态（该模型带视觉塔，需先下载 mmproj，见 README）----
      # - --mmproj
      # - /models/mmproj-F16.gguf

    healthcheck:
      # 镜像自带 curl；/health 在模型加载完成后返回 {"status":"ok"}
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      # --load-mode none 会把整个权重读进内存，22GB 首次加载需要时间
      start_period: 600s
  # ============================================================================
  # 模型二：Qwen3.8-Flash-Next（MoE，512 专家/层，每 token 激活约 10 个；Coder 档保留 256）
  # 引擎换成 Strata：专家权重按热度在显存 / 内存 / SSD 之间调度，12G 显存可以跑起来。
  # 只在 `--profile strata` 下启动（`pixi run strata-up`），宿主端口默认 8081。
  # ============================================================================
  strata:
    # 固定版本 tag（可用 `latest-cuda13`，或换成 0.2.7-cuda13 等已验证版本）
    # cuda13：RTX 20/30/40/50 + 驱动 580+；cuda12：GTX 10 / P100 / V100，或驱动 575–579
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.11-cuda13}
    container_name: qwen38-flash-next
    profiles: ["strata"]
    restart: unless-stopped
    gpus: all
    ports:
      # 和 llama-server 的 8080 错开；只绑回环。Strata 强制要求 API key（无 key 时首启自动生成）
      - "${STRATA_BIND_ADDR:-127.0.0.1}:${STRATA_PORT:-8081}:8080"
    volumes:
      # 模型文件（约 70 GB 下载 + 6 GB MTP 草稿层）、preset、key 全部落在宿主机项目目录
      - ./strata-data:/data
    environment:
      # qwen = ISTA-DASLab 的原版 Flash-Next 分档；coder / swift 等见 README
      FAMILY: ${STRATA_FAMILY:-qwen}
      # Q2_0 / IQ2_XS / IQ3_XXS / IQ3_S；空 = 由 Strata 按显卡自己选
      MODEL: ${STRATA_MODEL:-IQ2_XS}
      CONTEXT: ${STRATA_CONTEXT:-128k}
      # 会话 KV 格式：int8（默认）/ q4_0 / k8v4 / fp16
      KV: ${STRATA_KV:-int8}
      VISION: ${STRATA_VISION:-off}
      # quick / thorough / skip：首启是否跑一次硬件校准（结果存进 /data，只跑一次）
      TUNE: ${STRATA_TUNE:-skip}
      # 空 = Strata 按卡自动；1–8
      PARALLEL: ${STRATA_PARALLEL:-}
      # 16 字符以上；留空则首启自动生成，`pixi run strata-key` 查看
      API_KEY: ${STRATA_API_KEY:-}
    ulimits:
      # 引擎会把几十 GB 内存锁页（mlock），不加这个会退化成更慢的路径
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    # 停止时要把模型从内存/显存里卸干净，Docker 默认 10s 太短
    stop_grace_period: 2m
    # 健康检查用镜像自带的（GET /v1/models + key），首次下载/加载期间显示 starting
