# 本地 LLM 推理服务：一个 Strata 服务，两个模型按需切换（说明见 README）。
#
#   Qwen3.8-Flash-Next   FAMILY=qwen     MODEL=IQ2_XS       宿主 127.0.0.1:8080
#   Qwen3.6-35B-A3B      FAMILY=qwen36   MODEL=UD-Q4_K_XL   宿主 127.0.0.1:8080
#
# 两个模型共用这一个服务，没有第二个容器。切换模型就是换下面 environment 里的
# FAMILY / MODEL / PRESET 三个值，然后重建容器：
#
#   pixi run model-35b     # 切到 Qwen3.6-35B-A3B（改写 .env 并重建容器）
#   pixi run model-flash   # 切回 Qwen3.8-Flash-Next
#
# 也可以手改 .env 里的 STRATA_FAMILY / STRATA_MODEL / STRATA_PRESET 再 `pixi run recreate`。
# 12G 卡同一时间只加载一个模型，所以切换 = 卸载旧模型、加载新模型；两边共用一个数据目录，
# 权重和 preset 都保留，切回来不会重新下载。
#
#   cp .env.example .env
#   pixi run preflight     # 驱动 / 内存 / 磁盘 / 端口自检
#   pixi run up            # 启动（首次会下载模型）
#   pixi run smoke         # 健康检查 + 一次补全
name: qwen-strata

services:
  strata:
    # 固定版本 tag（可用 `latest-cuda13`，或换成 0.2.7-cuda13 等已验证版本）
    # cuda13：RTX 20/30/40/50 + 驱动 580+；cuda12：GTX 10 / P100 / V100，或驱动 575–579
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.11-cuda13}
    container_name: qwen-strata
    restart: unless-stopped
    # NVIDIA GPU 透传（等价 docker run --gpus all）
    gpus: all
    ports:
      # 默认只绑本机回环；需要局域网 / 远程访问时把 STRATA_BIND_ADDR 改成 0.0.0.0
      # （服务强制要求 API key，但暴露到公网前仍建议加反代 + 认证）
      - "${STRATA_BIND_ADDR:-127.0.0.1}:${STRATA_PORT:-8080}:8080"
    volumes:
      # 模型（两个模型都在这里）、预处理包、草稿层、preset、API key
      # 默认 ./strata-data；已经下好模型时指过去（如 STRATA_DATA_DIR=/mnt/raid/llm_models），不会再下载
      - ${STRATA_DATA_DIR:-./strata-data}:/data
    environment:
      # ========================================================================
      # 模型选择：切换模型只改这三项（.env 里由 pixi run model-* 帮你改）
      #   Flash-Next  ：FAMILY=qwen    MODEL=IQ2_XS       PRESET=flash-next
      #   35B-A3B     ：FAMILY=qwen36  MODEL=UD-Q4_K_XL   PRESET=qwen36-35b
      # PRESET 是 Strata 在数据目录里存运行参数的槽位名；两个模型各用一个，
      # 切来切去不会互相覆盖各自调好的上下文 / 并发设置。
      # ========================================================================
      FAMILY: ${STRATA_FAMILY:-qwen}
      MODEL: ${STRATA_MODEL:-IQ2_XS}
      PRESET: ${STRATA_PRESET:-flash-next}
      # 上下文：32k / 64k / 128k / 256k，或直接写 token 数
      # 128k 是 Flash-Next 的实测值；35B-A3B 在 12G 卡上 Strata 建议 32k（显存不够时按卡自动选）
      CONTEXT: ${STRATA_CONTEXT:-128k}
      # 会话 KV 格式：int8（默认）/ q4_0（省一半）/ k8v4 / fp16
      KV: ${STRATA_KV:-int8}
      # 图片输入：off / on / gpu / cpu（on 会额外下载约 0.9 GB 的图片读取器）
      VISION: ${STRATA_VISION:-off}
      # 首启是否做硬件校准：quick / thorough / skip（结果存进数据目录，只跑一次）
      TUNE: ${STRATA_TUNE:-skip}
      # 并发请求数：留空 = 按显卡自动；范围 1–8
      PARALLEL: ${STRATA_PARALLEL:-}
      # 访问用的 API key：16 字符以上；留空则首启自动生成，`pixi run key` 查看
      API_KEY: ${STRATA_API_KEY:-}
      # 给系统留出的空闲内存（GiB）：0 = 尽量用满（默认）
      STRATA_RAM_KEEP_GIB: ${STRATA_RAM_KEEP_GIB:-0}
      # 高级引擎参数，空格分隔 KEY=VALUE，等价于 `strata launch --set`（一般留空）
      STRATA_SET: ${STRATA_SET:-}
      # 模型下载源：空 = HuggingFace（默认）；modelscope = 魔搭（国内，路径一致）
      STRATA_SOURCE: ${STRATA_SOURCE:-}
      # HuggingFace 镜像站（可选，例如 https://hf-mirror.com）；与 STRATA_SOURCE 二选一
      HF_ENDPOINT: ${HF_ENDPOINT:-}
    ulimits:
      # 引擎会把几十 GB 内存锁页（mlock），不加这个会退化成更慢的路径
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    # 停止时要把模型从内存/显存里卸干净，Docker 默认 10s 太短
    stop_grace_period: 2m
    # 健康检查用镜像自带的（GET /v1/models + key），首次下载 / 加载期间显示 starting
